# Build static develop branch and publish to piggy-edge gh-pages

name: Piglet Pages

on:
  repository_dispatch:
    types: [ fill_piggybank ]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Invalidate the cached demo and rebuild every page"
        required: false
        default: false
        type: boolean
  push:
    branches: [ develop ]

concurrency:
  group: "piggy-edge"
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Checkout piggybank
        uses: actions/checkout@v7
        with:
          repository: VaagenIM/piggybank
          ref: output
          token: ${{ secrets.PIGGYPAT }}
          path: piggybank
          fetch-depth: 1

      - name: Restore demo cache
        uses: actions/cache@v6
        with:
          path: |
            .github/workflows/demo
            .github/workflows/.demo-state.json
          key: pages-demo-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pages-demo-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: |
          uv pip install . -r .github/workflows/requirements-pages.txt
          echo "GITHUB_PAGES=1" >> "$GITHUB_ENV"
          echo "USE_CACHE=0" >> "$GITHUB_ENV"
          echo "PIGGY_VERSION=$(bash .github/workflows/scripts/compute-version.sh)" >> "$GITHUB_ENV"

      - name: Start Piggy server
        run: |
          workers=$(nproc --ignore=1)
          workers=$((workers < 1 ? 1 : workers))
          gunicorn --bind 0.0.0.0:55555 -t 60 --preload --workers "$workers" run:app &

      - name: Run web scraper
        env:
          FORCE_FULL_REBUILD: ${{ inputs.full_rebuild || 'false' }}
        run: |
          sed -i 's/piggy.iktim.no/piglet.iktim.no/g' .github/workflows/web_scraper.py
          python .github/workflows/web_scraper.py
          echo "piglet.iktim.no" > .github/workflows/demo/CNAME
          
      - name: Deploy to piggy-edge gh-pages
        run: |
          rm -rf edge-deploy
          mkdir edge-deploy
          cd edge-deploy

          git init
          git checkout -b gh-pages

          cp -a ../.github/workflows/demo/. .
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy develop preview ${GITHUB_SHA}"

          git remote add origin \
            https://${{ secrets.PIGGYPAT }}@github.com/VaagenIM/piggy-edge.git

          git push --force origin gh-pages
