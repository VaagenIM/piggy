# Build static develop branch and publish to piggy-edge gh-pages

name: Piglet Pages

on:
  repository_dispatch:
    types: [ fill_piggybank ]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Invalidate the cached demo and rebuild every page"
        required: false
        default: false
        type: boolean
  push:
    branches: [ develop ]

concurrency:
  group: "piggy-edge"
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Set up Python
        run: uv python install

      - name: Cleanup earlier runs
        run: |
          rm -rf piggybank
          pkill -f gunicorn || true
          pkill -f python || true

      - name: Checkout piggybank
        uses: actions/checkout@v7
        with:
          repository: VaagenIM/piggybank
          ref: output
          token: ${{ secrets.PIGGYPAT }}
          path: piggybank
          fetch-depth: 0

      - name: Restore demo cache
        uses: actions/cache@v6
        with:
          path: |
            .github/workflows/demo
            .github/workflows/.demo-state.json
          key: pages-demo-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pages-demo-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          uv pip install .
          echo "GITHUB_PAGES=1" >> $GITHUB_ENV
          echo "USE_CACHE=0" >> $GITHUB_ENV
          uv pip install -r .github/workflows/requirements-pages.txt

      - name: Start Piggy server
        run: |
          workers=$(nproc --ignore=1)
          workers=$((workers < 1 ? 1 : workers))
          gunicorn --bind 0.0.0.0:55555 -t 60 --preload --workers "$workers" run:app &

      - name: Modify CNAME in web scraper
        run: sed -i 's/piggy.iktim.no/piglet.iktim.no/g' .github/workflows/web_scraper.py

      - name: Run web scraper
        env:
          FORCE_FULL_REBUILD: ${{ inputs.full_rebuild || 'false' }}
        run: python .github/workflows/web_scraper.py

      - name: Add custom domain
        run: |
          echo "piglet.iktim.no" > .github/workflows/demo/CNAME

      - name: Deploy to piggy-edge gh-pages
        run: |
          if [ -d edge-deploy/.git ]; then
            git -C edge-deploy fetch --depth 1 origin gh-pages
            git -C edge-deploy checkout -B gh-pages origin/gh-pages
            git -C edge-deploy reset --hard origin/gh-pages
            git -C edge-deploy clean -fdx
          else
            git clone --depth 1 --branch gh-pages \
              https://${{ secrets.PIGGYPAT }}@github.com/VaagenIM/piggy-edge.git \
              edge-deploy
          fi

          cd edge-deploy

          # Remove old site contents except git metadata
          find . \
            -mindepth 1 \
            -not -path "./.git*" \
            -delete

          cp -R ../.github/workflows/demo/* .

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Deploy develop preview ${GITHUB_SHA}" || echo "No changes"

          git push origin gh-pages --force
