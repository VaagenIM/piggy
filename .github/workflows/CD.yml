# Upload to ghcr.io (:edge if on develop branch, :latest if on main branch)
# Builds linux/amd64 and linux/arm64 on the self-hosted runners when the run is trusted (piggyvisor#31). arm64 is
# emulated with QEMU, registered once on the Docker host (piggyvisor#33): workflows never set it up, because that
# needs --privileged. The build checks arm64 emulation first and the pushed manifest last.
# Runner policy (piggyvisor#31, see AGENTS.md): never loosen the trust check or extend the allowlist.

name: CD

on:
  # TODO: On test pass vs on push
  push:
    branches:
      - main
      # - develop

env:
  IMAGE_NAME: ghcr.io/vaagenim/piggy
  IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'edge' }}
  PLATFORMS: linux/amd64,linux/arm64/v8

permissions:
  contents: read

jobs:
  build:
    name: Release
    runs-on: >-
      ${{ (contains(fromJSON('["push","workflow_dispatch","schedule","pull_request"]'), github.event_name) &&
           github.actor != 'dependabot[bot]' &&
           (github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
             github.event.pull_request.user.type != 'Bot' &&
             (github.event.repository.private ||
              contains(fromJSON('["sondregronas","svHvidsten","gulfarris"]'), github.event.pull_request.user.login)))))
          && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    # TODO: Ensure tests pass before building
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "value=$(bash .github/workflows/scripts/compute-version.sh)" >> "$GITHUB_OUTPUT"

      # The runners share the host's Docker daemon: no --privileged, no host mounts or host network, and the
      # builder and probe image this job uses are removed at the end (piggyvisor#31).
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Check arm64 emulation
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          arch=$(docker run --rm --platform linux/arm64 --name "arm64-check-$GITHUB_RUN_ID" alpine:3.20 uname -m)
          echo "arm64 container: $arch"
          docker buildx ls
          if [ "$arch" != aarch64 ] || ! docker buildx inspect "$BUILDER" | grep -q 'linux/arm64'; then
            echo "::error::The runner host cannot build linux/arm64 (QEMU binfmt, piggyvisor#33)"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            PIGGY_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Check the pushed manifest
        env:
          REF: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          docker buildx imagetools inspect "$REF"
          for platform in linux/amd64 linux/arm64; do
            if ! docker buildx imagetools inspect "$REF" | grep -qE "Platform: *$platform(/v8)?$"; then
              echo "::error::$REF has no $platform image"
              exit 1
            fi
          done

      - name: Remove the builder and probe image this job created
        if: always()
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          if [ -n "$BUILDER" ]; then docker buildx rm --force "$BUILDER" || true; fi
          docker rm -f "arm64-check-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          docker image rm alpine:3.20 >/dev/null 2>&1 || true
