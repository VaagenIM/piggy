# A static version of the site is built and deployed using a web scraper

name: Pages

on:
  repository_dispatch:
    types: [fill_piggybank]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild every page instead of only the pages the content changes affect"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Delete old piggybank if it exists
        run: |
          if [ -d piggybank ]; then
            rm -rf piggybank
          fi

      - name: Checkout piggybank
        uses: actions/checkout@v7
        with:
          repository: VaagenIM/piggybank
          ref: output
          token: ${{ secrets.PIGGYPAT }}
          path: piggybank
          fetch-depth: 0

      # The previous build and what it was built from, so only the pages that changed are built again
      - name: Restore the previous build
        uses: actions/cache/restore@v6
        with:
          path: |
            .github/workflows/demo
            .github/workflows/.demo-state.json
          key: pages-main-${{ github.run_id }}
          restore-keys: pages-main-

      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: |
          uv pip install . -r .github/workflows/requirements-pages.txt
          echo "GITHUB_PAGES=1" >> $GITHUB_ENV
          echo "USE_CACHE=0" >> $GITHUB_ENV
          echo "PIGGY_VERSION=$(bash .github/workflows/scripts/compute-version.sh)" >> $GITHUB_ENV

      - name: Start Piggy server
        run: |
          # The container's CPU limit, not the host's cores (piggyvisor#31); one CPU is left for the scraper.
          workers=$(( $(python .github/workflows/cpus.py) - 1 ))
          workers=$((workers < 1 ? 1 : workers))
          gunicorn --bind 0.0.0.0:55555 -t 60 --preload --workers "$workers" run:app &

      - name: Run web scraper to build static site
        env:
          FORCE_FULL_REBUILD: ${{ inputs.full_rebuild || false }}
        run: python .github/workflows/web_scraper.py

      - name: Save the build for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            .github/workflows/demo
            .github/workflows/.demo-state.json
          key: pages-main-${{ github.run_id }}

      - name: Name artifact for this build attempt
        id: artifact-name
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ./.github/workflows/demo

  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Wait for the uploaded artifact to be discoverable
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            const artifactName = process.env.ARTIFACT_NAME;
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0 || !artifactName) {
              throw new Error('The build did not return an artifact ID and name');
            }
            for (let attempt = 0; attempt < 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: context.runId,
                per_page: 100
              });
              const matches = artifacts.filter(a => a.name === artifactName && !a.expired);
              if (matches.length > 1) {
                throw new Error(`Multiple artifacts named ${artifactName}`);
              }
              if (matches.length === 1 && matches[0].id === artifactId) {
                core.info(`Artifact ${artifactName} (${artifactId}) is available`);
                return;
              }
              core.info(`Waiting for artifact ${artifactName} (${attempt + 1}/12)`);
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Artifact ${artifactName} (${artifactId}) was not discoverable`);

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
