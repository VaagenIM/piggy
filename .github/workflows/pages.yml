# A static version of the site is built and deployed using a web scraper

name: Pages

on:
  repository_dispatch:
    types: [ fill_piggybank ]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild every page instead of only the pages the content changes affect"
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Delete old piggybank if it exists
        run: |
          if [ -d piggybank ]; then
            rm -rf piggybank
          fi

      - name: Checkout piggybank
        uses: actions/checkout@v7
        with:
          repository: VaagenIM/piggybank
          ref: output
          token: ${{ secrets.PIGGYPAT }}
          path: piggybank
          fetch-depth: 0

      # The previous build and what it was built from, so only the pages that changed are built again
      - name: Restore the previous build
        uses: actions/cache/restore@v6
        with:
          path: |
            .github/workflows/demo
            .github/workflows/.demo-state.json
          key: pages-main-${{ github.run_id }}
          restore-keys: pages-main-

      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: |
          uv pip install . -r .github/workflows/requirements-pages.txt
          echo "GITHUB_PAGES=1" >> $GITHUB_ENV
          echo "USE_CACHE=0" >> $GITHUB_ENV
          echo "PIGGY_VERSION=$(bash .github/workflows/scripts/compute-version.sh)" >> $GITHUB_ENV

      - name: Start Piggy server
        run: |
          workers=$(nproc --ignore=1)
          workers=$((workers < 1 ? 1 : workers))
          gunicorn --bind 0.0.0.0:55555 -t 60 --preload --workers "$workers" run:app &

      - name: Run web scraper to build static site
        env:
          FORCE_FULL_REBUILD: ${{ inputs.full_rebuild || false }}
        run: python .github/workflows/web_scraper.py

      - name: Save the build for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            .github/workflows/demo
            .github/workflows/.demo-state.json
          key: pages-main-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: ./.github/workflows/demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
