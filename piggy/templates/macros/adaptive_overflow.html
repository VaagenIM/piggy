{% macro adaptive_tier_bootstrap() %}
  <script>
    (function () {
      var container = document.currentScript.previousElementSibling;
      if (!container || !container.hasAttribute('data-adaptive-overflow')) {
        return;
      }
      var key = container.dataset.adaptiveKey;
      if (!key) return;

      var stored;
      try {
        stored = localStorage.getItem('piggy:adaptive-tier:' + key);
      } catch (e) {
        return;
      }
      if (stored === null) return;

      var tiers = container.querySelectorAll(':scope > [data-adaptive-tier]');
      var target = null;
      tiers.forEach(function (tier) {
        if (tier.dataset.adaptiveTier === stored) target = tier;
      });
      if (!target) return;

      tiers.forEach(function (tier) {
        tier.classList.toggle('is-active', tier === target);
      });
      container.dataset.activeTier = stored;
    })();
  </script>
{% endmacro %}

{% macro adaptive_compact_bootstrap() %}
  <script>
    (function () {
      var compactor = document.currentScript.previousElementSibling;
      if (!compactor || !compactor.hasAttribute('data-adaptive-compact')) {
        return;
      }
      var key = compactor.dataset.adaptiveKey;
      if (!key) return;

      var stored;
      try {
        stored = localStorage.getItem('piggy:adaptive-compact:' + key);
      } catch (e) {
        return;
      }
      if (stored) compactor.dataset.compact = stored;
    })();
  </script>
{% endmacro %}
