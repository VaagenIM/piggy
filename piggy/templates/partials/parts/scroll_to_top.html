<button id="scroll-to-top-btn">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M5 15l7-7 7 7" />
  </svg>
</button>

<script>
  const scrollToTopBtn = document.getElementById('scroll-to-top-btn');
  const siteFooter = document.querySelector('.site-footer');

  function updateScrollToTopOffset() {
    if (!siteFooter) return;

    const gap = parseFloat(getComputedStyle(scrollToTopBtn).bottom) || 0;
    const footerClearance = gap / 2;
    const buttonBottomEdge = window.innerHeight - gap;
    const footerTop = siteFooter.getBoundingClientRect().top;
    const overlap = buttonBottomEdge - footerTop + footerClearance;

    scrollToTopBtn.style.setProperty(
      '--scroll-to-top-offset',
      overlap > 0 ? `-${overlap}px` : '0px'
    );
  }

  function piggyShouldReduceScrollMotion() {
    const preference = document.documentElement.getAttribute(
      'data-reader-reduce-motion'
    );

    if (preference === 'reduce') return true;
    if (preference === 'allow') return false;

    return Boolean(
      window.matchMedia?.('(prefers-reduced-motion: reduce)').matches
    );
  }

  window.addEventListener('scroll', () => {
    if (window.scrollY > 150) {
      scrollToTopBtn.classList.add('is-visible');
    } else {
      scrollToTopBtn.classList.remove('is-visible');
    }

    updateScrollToTopOffset();
  });

  window.addEventListener('resize', updateScrollToTopOffset);

  scrollToTopBtn.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: piggyShouldReduceScrollMotion() ? 'auto' : 'smooth',
    });
  });

  updateScrollToTopOffset();
</script>
